<!DOCTYPE html>
<html>
<head>
    <title>Block Explorer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <h1>🔗 Blockchain Explorer</h1>
        <div id="chainSummary"></div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        async function loadExplorer() {
            const res = await fetch('/api/blockchain/chain');
            const chain = await res.json();
            const container = document.getElementById('chainSummary');
            container.innerHTML = chain.map(block => `
                <div class="card">
                    <h4>Block #${block.index}</h4>
                    <p>Hash: ${block.hash.substring(0, 20)}...</p>
                    <p>Prev: ${block.previousHash.substring(0, 20)}...</p>
                    <p>Votes: ${block.voteCount}</p>
                    <p>Timestamp: ${new Date(block.timestamp).toLocaleString()}</p>
                </div>
            `).join('');
        }
        loadExplorer();
    </script>
</body>
</html>
