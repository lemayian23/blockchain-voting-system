<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name=""viewport" contant="width=device-width, initial-scale=1.0">
    <title>Student Voting Portal | Technical University of Kenya</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗳️ Technical University of Kenya</h1>
            <h2>Student Voting System (Blockchain)</h2>
        </header>

        <!--Login Section-->
        <div id="loginSection" class="card">
            <h3>Student Login</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label>Student ID:</label>
                    <input type="text" id="password" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn-btn-primary">Login</button>
            </form>
            <div class="demo-info">
                <p>Demo Credentials: S001/pass123, S002/pass123, S003/pass123</p>
            </div>
        </div>
    </div>

    <!-- Voting Section (hidden after login) -->
     <div id="votingSection" style="display:none;">
        <div class=""card">
            <h3>Welcome, <span id=StudentName"></span></h3>
            <div id="electionStatus" class="status-badge"></div>
            <div id="hasVotedWarning" class="warning" style="display:none;";>
                ⚠️ You have already voted. You cannot vote again.
            </div>
        </div>
     </div>
</body>
</html>
